name: scripts

on:
  push:
    paths: ['scripts/**', '.github/workflows/scripts.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/scripts.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.8'}   # 3.8 is not built for newer Ubuntu runners
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.9'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.8'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pillow
      - run: python -m unittest discover -s scripts -v
      - run: python scripts/cleanhome.py --help
